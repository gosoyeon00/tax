 \uC548 \uB0B8 1\uAE30\uAC00, 1\uC6D4 1~25\uC77C\uC5D0\uB294 \uC791\uB144 2\uAE30\uAC00 \uBE60\uC838 \uC788\uC5C8\uC2B5\uB2C8\uB2E4. \uC774\uC81C \uBCF4\uACE0 \uC788\uB294 \uC5F0\uB3C4\uC640 \uC0C1\uAD00\uC5C6\uC774 \uC624\uB298 \uAE30\uC900\uC73C\uB85C \uC2E0\uACE0 \uAE30\uD55C\uC774 \uC548 \uC9C0\uB09C \uC138\uAE08(1~5\uC6D4\uC5D0\uB294 \uC791\uB144 \uC885\uD569\uC18C\uB4DD\uC138 \uD3EC\uD568)\uC744 \uBAA8\uB450 \uB123\uACE0, \uC138\uAE08 \uD0ED\uC5D0 \uB0C8\uB2E4\uACE0 \uC801\uC740 \uAC74 \uBE8D\uB2C8\uB2E4."],["\uAC04\uC774\uACFC\uC138\uC790 \uACC4\uC0B0","1\uB144 \uB2E8\uC704\uB85C \uACC4\uC0B0\uD558\uACE0, 1\uB144 \uB9E4\uCD9C(\uBD80\uAC00\uC138 \uD3EC\uD568)\uC774 4,800\uB9CC\uC6D0 \uBBF8\uB9CC\uC774\uBA74 0\uC6D0\uC73C\uB85C \uBD05\uB2C8\uB2E4. \uC2E0\uACE0 \uD0ED\uC5D0 \uAC04\uC774\uACFC\uC138\uC790 \uC591\uC2DD\uC774 \uB530\uB85C \uB098\uC635\uB2C8\uB2E4."],["\uB2F5\uC774 \uBE48 \uD56D\uBAA9\uC740 \uBD88\uB9AC\uD55C \uCABD\uC73C\uB85C","\uCE74\uB4DC \uB0B4\uC5ED\uC73C\uB85C \uB123\uACE0 \uB2F5\uC744 \uC548 \uCC44\uC6B4 \uC2DD\uBE44\xB7\uCC28\uB7C9\xB7\uAD6C\uB3C5\uC740 \uACBD\uBE44\xB7\uACF5\uC81C\uB97C \uBE7C\uACE0 \uACC4\uC0B0\uD569\uB2C8\uB2E4. \uC138\uAE08\uC744 \uBAA8\uC790\uB77C\uAC8C \uB5BC\uC5B4\uB450\uC9C0 \uC54A\uB3C4\uB85D \uD558\uB824\uB294 \uAC83\uC774\uACE0, \uB2F5\uC744 \uCC44\uC6B0\uBA74 \uBC14\uB85C \uB2E4\uC2DC \uACC4\uC0B0\uB429\uB2C8\uB2E4."],["\uACE0\uCE5C \uBC84\uADF8","\uB0A0\uC9DC \uC5C6\uC774 \uB0A8\uAE34 \uC794\uAE08\uC744 \uACE0\uCE58\uBA74 \uB9E4\uCD9C\uB85C \uBC14\uB00C\uB358 \uBB38\uC81C \xB7 \uACC4\uC57D \uC815\uBCF4\uC5D0\uC11C \uAC70\uB798\uCC98\uB9CC \uBC14\uAFD4\uB3C4 \uBA54\uBAA8\uAC00 \uC9C0\uC6CC\uC9C0\uB358 \uBB38\uC81C \xB7 \uC785\uAE08\uC77C\uB9CC \uB123\uC73C\uBA74 \u2018\uC785\uAE08 \uB300\uAE30\u2019\uB85C \uB0A8\uB358 \uBB38\uC81C \xB7 \uB450 \uBC88\uC9F8 \uB9E4\uCD9C\uBD80\uD130 \uC99D\uBE59\uC774 \u2018\uC0AC\uC5C5\uC6A9 \uCE74\uB4DC\u2019\uB85C \uBC14\uB00C\uB358 \uBB38\uC81C \xB7 \uC720\uD615\uC744 \uBC14\uA
