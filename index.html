uC788\uC2B5\uB2C8\uB2E4."],["\uC5F0\uAC04 \uD0ED\uC5D0\uC11C \uD56D\uBAA9 \uACE8\uB77C \uBCF4\uAE30","\uC9C0\uCD9C \uD56D\uBAA9\uC744 \uACE8\uB77C \uADF8\uAC83\uB9CC \uC6D4\uBCC4\uB85C \uBCFC \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC8FC\uC720\uBE44\uB9CC, \uC778\uAC74\uBE44\uB9CC, \uB610\uB294 \uB458\uC744 \uD569\uCCD0\uC11C. \uD569\uACC4\uC640 \uC6D4\uD3C9\uADE0, \uAE30\uB85D\uB41C \uB2EC \uC218\uAC00 \uD568\uAED8 \uB098\uC635\uB2C8\uB2E4."]]},{\uB0A0:"2026\uB144 9\uC6D4 4\uC77C",\uAC83\uB4E4:[["\uC774\uC6A9 \uD604\uD669 \uC218\uC9D1 \uD56D\uBAA9 \uCD94\uAC00","\uC5B4\uB290 \uD0ED\uC744 \uBCF4\uB294\uC9C0, \uCE74\uB4DC \uBD88\uB7EC\uC624\uAE30\xB7\uBC31\uC5C5\xB7\uACC4\uC815 \uB9CC\uB4E4\uAE30\uB97C \uC4F0\uB294\uC9C0 \uAC19\uC740 \uAE30\uB2A5 \uC0AC\uC6A9 \uC5EC\uBD80\uB97C \uD1B5\uACC4\uB85C \uBCF4\uB0C5\uB2C8\uB2E4. \uC5B4\uB5A4 \uAE30\uB2A5\uC744 \uB2E4\uB4EC\uC5B4\uC57C \uD560\uC9C0 \uD310\uB2E8\uD558\uB824\uB294 \uAC83\uC774\uACE0, \uAE08\uC561\xB7\uAC70\uB798\uCC98 \uB4F1 \uAE30\uB85D \uB0B4\uC6A9\uC740 \uBCF4\uB0B4\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uAC1C\uC778\uC815\uBCF4\uCC98\uB9AC\uBC29\uCE68\uC5D0\uB3C4 \uC801\uC5B4\uB450\uC5C8\uC2B5\uB2C8\uB2E4."],["\uBC31\uC5C5 \uC54C\uB9BC","\uACC4\uC815 \uC5C6\uC774 \uC4F0\uC2DC\uB294 \uBD84\uAED8 \uAE30\uB85D\uC774 \uC313\uC600\uB294\uB370 \uBC31\uC5C5\uC774 \uC5C6\uAC70\uB098 \uD55C \uB2EC\uC774 \uB118\uC5C8\uC73C\uBA74 \uC54C\uB824\uB4DC\uB9BD\uB2C8\uB2E4. \uACC4\uC815\uC744 \uB9CC\uB4DC\uC2E0 \uBD84\uC740 \uC11C\uBC84\uC5D0 \uC62C\uB77C\uAC00\uBBC0\uB85C \uB728\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4."],["\uC778\uD130\uB137\uC774 \uB04A\uAE30\uBA74 \uC54C\uB824\uB4DC\uB9BD\uB2C8\uB2E4","\uC5F0\uACB0\uC774 \uB04A\uAE34 \uB3D9\uC548\uC740 \uC774 \uAE30\uAE30\uC5D0\uB9CC \uC800\uC7A5\uB418\uACE0, \uB2E4\uC2DC \uC5F0\uACB0\uB418\uBA74 \uC11C\uBC84\uB85C \uC62C\uB77C\uAC04\uB2E4\uB294 \uAC78 \uD654\uBA74 \uC704\uC5D0 \uD45C\uC2DC\uD569\uB2C8\uB2E4."],["\uB2F5 \uC548 \uD55C \uD56D\uBAA9 \uD45C\uC2DC","\uC2DD\uBE44\xB7\uCC28\uB7C9\xB
