,{날:"2026년 10월 16일",것들:[["작년 수입으로 단순경비율 판단","설정 › 업종 아래에 ‘작년 수입’ 칸이 생겼습니다. 작년 수입이 업종 기준(예: 3.3% 프리랜서·영상 제작업 3,600만원, 서비스업 2,400만원)보다 적으면 5월에 단순경비율로 신고할 수 있어서, 장부와 단순경비율 중 세금이 적은 쪽으로 계산합니다. 작년 기록이 앱에 있으면 한 번에 채울 수 있고, 올해 처음 시작했다면 체크만 하시면 됩니다. 비워두면 지금처럼 장부 기준이고, 단순경비율 쪽이 크게 적어 보이면 안내만 드립니다."]]},{날:"2026년 10월 8일",것들:[["‘연간’ 탭이 ‘손익’ 탭으로","월별·연간을 골라 ‘매출 − 비용 = 사업에서 남은 돈’을 손익계산서처럼 보여드립니다. 비용은 항목별로 나눠 매출의 몇 %인지 함께 보이고, 12개월을 한 표로 보는 ‘월별 한눈에’도 있습니다. 예전 항목별 월 표는 그 아래에 그대로 있습니다."],["실제로 나한테 남는 돈","사업에서 남은 돈에서 세금 몫, 건강보험·국민연금(설정에 넣은 경우), 직접 넣은 생활비·대출 같은 고정비까지 빼서 실제로 남는 돈을 보여드립니다. 고정비는 손익 탭의 ‘고정비·대출 넣기’에서 넣고, 대출처럼 기간이 있으면 시작·끝나는 달을 정할 수 있습니다. 백업과 로그인 동기화에도 함께 담깁니다."],["서버 동기화가 멈추던 문제","기록이 수백 건을 넘으면(아이폰은 더 일찍) 서버에 올리지 못하고 ‘연결되면 다시 올립니다’만 반복되던 문제를 고쳤습니다. 설정·납부·고정비만 바꾼 것도 다른 기기와 제대로 맞춰지고, 같은 기기에서 탭 두 개를 열어도 서로의 기록을 덮어쓰지 않습니다. 다른 기기에서 기록을 모두 지웠을 때는 따라 지우지 않고 어느 쪽을 쓸지 물어봅니다. 올리기에 실패하면 30초 뒤 한 번 더 해봅니다."],["로그아웃할 때 이 기기 기록도 지우기","공용 컴퓨터라면 로그아웃할 때 ‘이 기기에 있는 기록도 지우기’를 켜세요. 서버에 다 올라간 걸 확인한 뒤에만 지웁니다. 전체 기록 삭제 직전에는 백업 파일을 자동으로 내려받습니다."],["예정고지·중간예납","세금 탭에 부가세 예정고지(4월·10월, 간이과세자는 7월 예정부과)와 종합소득세 중간예납(11월)으로 미리 낸 금액을 적는 칸을 넣었습니다. 적으면 ‘앞으로 낼 세금’에서 그만큼만 빠집니다(예전에는 그 기간 전체가 빠졌습니다). 기한이 토·일요일이면 다음 월요일까지로 셉니다."],["영세율 매출","사업자등록을 한 방송인·사업자가 애드센스처럼 해외에서 외화로 받는 돈을 ‘영세율’로 넣을 수 있습니다. 부가세 0%로 계산하고 신고 탭에 영세율 칸으로 보여드립니다."],["안내 문구 바로잡기","경비율 대상이어도 장부로 신고할 수 있다는 점, 원천세를 빠뜨리면 경비가 안 되는 게 아니라 가산세가 붙는다는 점, 접대비 기본한도(중소기업 3,600만원), 소규모사업자의 가산세 면제, 부가세 기간은 공급시기로 갈린다는 점을 바로잡았습니다. 해외 인보이스는 증빙 가산세 대상으로 잡지 않고, 기준경비율 참고 계산에 법정 상한(단순경비율 소득의 2.8배)을 넣었습니다."],["쓰기 편하게·빠르게","폰에서 탭 9개가 5칸 격자로 다 보이고, 스크롤해도 위에 붙어 있습니다. 수입을 넣을 때 ‘통장에 들어온 금액’ 칸은 금액 아래에 접어 두었고, 기록을 넣으면 알림이 뜨며 바로 되돌릴 수 있습니다. 머리의 숫자 설명은 폰에서 한 번 눌러 열립니다. 카드 내역 불러오기, 기록이 많을 때의 입력·간편장부 화면이 훨씬 빨라졌습니다."],["수수료 항목 추가","지출에 ‘수수료 (플랫폼·카드)’를 넣었습니다(프리랜서는 ‘수수료 (플랫폼)’). 크몽 같은 플랫폼이 보내주는 판매 수수료 계산서나 카드·결제 수수료를 따로 넣을 수 있습니다. 매출을 수수료 떼기 전 금액으로 넣은 건의 수수료만 넣으세요. 정산액으로 넣은 건의 수수료까지 넣으면 두 번 빠집니다."],["플랫폼 매출이 정산액인지 표시","크몽·숨고 같은 플랫폼 매출 중 금액이 딱 떨어지지 않아 수수료를 뗀 정산액으로 보이는 건을 기록 탭 맨 위에 모아 보여드립니다. ‘정산액이 맞아요’나 ‘전체 금액이에요’를 한 번 누르면 목록에도 표시가 남습니다. 정산액으로 넣은 플랫폼 매출과 수수료 지출이 같은 해에 함께 있으면 진단에서도 알려드립니다. 인터넷방송인 유형은 원래 정산액으로 넣는 방식이라 해당 없습니다."],["카드 불러오기: 크몽·숨고는 광고비로","카드 내역의 크몽·숨고 결제는 대개 판매자가 내는 광고·견적 비용이라 ‘광고선전비’로 짐작합니다(예전에는 외주비). 외주를 맡긴 결제라면 항목을 바꿔주세요. 광고 항목이 없는 유형에서 크몽 결제는 예전처럼 외주로 둡니다."],["링크 미리보기와 앱 아이콘","카톡·X 등에 주소를 붙이면 앱 이름과 그림이 담긴 미리보기가 뜨고, 휴대폰 홈 화면에 추가하면 앱 아이콘이 보입니다. 9월 27일부터 적용됐습니다."]]},{날:"2026년 9월 26일",것들:[["처음 오신 분께 시작 화면","처음 열면 어떤 앱인지 한 줄로 알려드리고, 어떻게 일하는지 → 업종 → 첫 수입 순서로 30초 안에 시작할 수 있게 했습니다. 건너뛰어도 되고, 계정이 있으면 바로 로그인할 수 있습니다. 이미 쓰시던 분께는 뜨지 않습니다."],["업종은 고르기 전까지 ‘미정’","새로 오신 분의 업종이 다른 업종으로 미리 들어가 있던 것을 ‘미정’으로 바꿨습니다. 업종을 고르기 전에는 경비 점검에서 비교하지 않고, 고르면 같은 업종 평균과 비교해 드립니다."],["백업 불러오기 전에 한 번 더 확인","백업 파일을 고르면 바로 바꾸지 않고 ‘지금 기록 몇 건 → 파일 기록 몇 건’을 먼저 보여드립니다. 바꾸기 전에 지금 기록을 파일로 자동으로 받아두고, 몇 건을 불러왔는지 화면 아래에 알려드립니다."],["카드 내역을 더 잘 읽습니다","윈도 엑셀에서 저장한 CSV(한글이 깨지던 파일)도 읽습니다. 가맹점 자리에 사업자번호가 들어가거나 부가세 빠진 금액을 읽던 문제를 고쳤고, 어느 열을 읽었는지 보여드리며 직접 바꿀 수도 있습니다. 폰에서는 한 건씩 카드 모양으로 보여 ‘항목’ 칸이 잘리지 않습니다."],["주소 변경 안내","처음 오신 분께는 띄우지 않고, 한 번 닫으면 다시 뜨지 않습니다. 예전 주소에서 쓰시던 분은 시작 화면에서 백업 파일을 바로 불러오실 수 있습니다."],["되돌리기와 카드 취소","백업을 불러오기 직전 기록을 이 브라우저에도 한 부 보관해, 카톡·X 안 브라우저처럼 파일이 안 받아지는 곳에서도 ‘되돌리기’로 되돌릴 수 있습니다. 카드 내역의 취소 줄은 같은 가맹점·같은 금액이면서 취소일과 같거나 이전인 원래 결제와 함께 뺍니다. 짝을 못 찾은 취소(부분취소, 지난달 결제의 취소 등)는 다른 결제를 건드리지 않고 목록 위에 따로 보여드리니, 필요하면 원래 결제의 금액을 직접 고쳐 주세요. 업종 검색은 서비스·콘텐츠 업종을 먼저 보여드립니다."],["통계에 사용자 유형 추가","원래 세던 이용 통계(화면 이동, 기록 추가, 카드 불러오기·백업 같은 기능을 쓴 횟수)에 ‘어떤 유형(사업자·프리랜서·방송인 등)의 분이 쓰시는지’를 더했습니다. 금액·거래처·업종 같은 기록 내용은 보내지 않습니다."]]},{날:"2026년 9월 23일 · 답 모아 하기 · 보험료",것들:[["답이 필요한 지출을 한곳에서","카드로 불러온 식비·차량·구독처럼 답이 비어 있는 기록을 기록 탭 맨 위에 모았습니다. 항목별로 묶여 있어서 ‘7건 전부 거래처와’처럼 한 번에 답하거나 한 건씩 고를 수 있습니다. 탭 이름 옆 숫자로 남은 건수가 보입니다."],["국민연금·건강보험료 반영","설정에 한 달 국민연금과 건강보험료를 넣으면, 국민연금은 소득에서 빼고 건강보험료는 경비로 넣어 세금을 계산합니다. 올해는 지난달까지 낸 걸로 셉니다. 회사를 다니시면 급여에서 처리되므로 칸이 나오지 않습니다."],["PC·노트북·휴대폰은 바로 경비","장비 질문에 ‘PC·노트북·휴대폰입니다’ 답이 생겼습니다. 이 셋(모니터 같은 주변기기 포함)은 세법상 금액과 상관없이 산 해에 바로 경비로 넣을 수 있어 5년에 나누지 않습니다."]]},{날:"2026년 9월 23일 · 감가상각",것들:[["장비는 5년에 나눠 경비로 잡습니다","한 건에 100만원이 넘는 장비(카메라·PC 등)는 산 해에 한꺼번에 경비로 넣지 않고, 5년에 걸쳐 나눠 그해 몫만 넣습니다. 방식은 세무사가 보통 쓰는 정률법(처음에 많이, 갈수록 적게)이고 산 해에는 산 달부터 셉니다. 그동안은 산 해에 전부 경비로 잡혀 그해 종합소득세가 실제보다 적게 나왔습니다. 넣을 때 해마다 얼마씩 들어가는지 바로 보여드리고, 해가 바뀌어도 앱이 알아서 그해 몫을 넣습니다. 부가세는 지금처럼 산 기에 전액 돌려받습니다. 자세한 설명은 도움말 › 장비 감가상각에 있습니다."],["신고 탭·간편장부","신고 탭에 장비별 올해 몫과 남은 금액이 나오고, 간편장부에는 12월 31일에 감가상각비가 한 줄 들어갑니다. 외주비·임차료처럼 장비가 아닌 100만원 넘는 지출은 예전처럼 바로 경비입니다."],["정액법과 정률법 안내","도움말 › 장비 감가상각에 두 방식의 차이를 정리했습니다. 앱은 장비의 기본 방식인 정률법으로 계산합니다."]]},{날:"2026년 9월 23일 (전체 점검)",것들:[["세금 계산을 바로잡았습니다","① 회사 급여가 있으면 급여분 세금까지 다시 잡혀 크게 나오던 문제를 고쳤습니다. 이제 급여에 이 수입이 더해져 늘어나는 세금만 보여드리고, 연말정산 결정세액은 넣지 않으셔도 됩니다. ② 일반과세자가 돌려받는 매입 부가세가 종합소득세 경비에도 또 들어가던 문제, ③ 계산서(면세) 매출에 부가세가 붙던 문제, ④ 가용 자금에서 부가세를 두 번 빼던 문제, ⑤ 사업 적자를 0으로 보던 문제(이제 급여에서 뺍니다)를 고쳤습니다."],["3.3%는 실제로 뗀 수입만 빼드립니다","사업자등록이 없는 분은 수입을 넣을 때 ‘3.3% 떼고 받음 / 안 떼고 받음’을 고릅니다. 애드센스처럼 안 떼고 받은 돈에서도 3.3%를 빼주던 문제를 고쳤습니다. 예전 기록은 설정의 ‘3.3%를 떼고 받습니다’를 따릅니다."],["해마다 따로 봅니다","상단에서 연도를 고를 수 있습니다. 작년 기록과 올해 기록이 월만 같으면 합쳐지던 문제를 고쳤고, 세금 탭의 납부 기록도 해마다 따로 적습니다."],["‘앞으로 낼 세금’이 기한 기준으로 바뀌었습니다","7월 1~25일에는 아직 안 낸 1기가, 1월 1~25일에는 작년 2기가 빠져 있었습니다. 이제 보고 있는 연도와 상관없이 오늘 기준으로 신고 기한이 안 지난 세금(1~5월에는 작년 종합소득세 포함)을 모두 넣고, 세금 탭에 냈다고 적은 건 뺍니다."],["간이과세자 계산","1년 단위로 계산하고, 1년 매출(부가세 포함)이 4,800만원 미만이면 0원으로 봅니다. 신고 탭에 간이과세자 양식이 따로 나옵니다."],["답이 빈 항목은 불리한 쪽으로","카드 내역으로 넣고 답을 안 채운 식비·차량·구독은 경비·공제를 빼고 계산합니다. 세금을 모자라게 떼어두지 않도록 하려는 것이고, 답을 채우면 바로 다시 계산됩니다."],["고친 버그","날짜 없이 남긴 잔금을 고치면 매출로 바뀌던 문제 · 계약 정보에서 거래처만 바꿔도 메모가 지워지던 문제 · 입금일만 넣으면 ‘입금 대기’로 남던 문제 · 두 번째 매출부터 증빙이 ‘사업용 카드’로 바뀌던 문제 · 유형을 바꾸면 지출이 사라지거나 식비 답의 뜻이 뒤집히던 문제 · 유형을 바꾸면 간이과세가 되돌아가던 문제 · 전체 기록 삭제가 설정까지 지우던 문제 · 경비율에 소수점을 못 넣던 문제 · 간편장부에 계약만 된 건과 경비 아닌 지출이 들어가던 문제 · 사업자등록한 방송인·프리랜서의 장비 부가세가 0원이던 문제."],["여러 기기 쓸 때 더 안전하게","다른 기기에서 바뀐 기록을 모르고 덮어쓰지 않도록, 올리기 전에 서버를 확인합니다. 한쪽에서만 바뀌었으면 알아서 맞추고, 양쪽 다 바뀌었을 때만 어느 쪽을 쓸지 묻습니다. 서버에서 받아오지 못했을 때는 올리지 않습니다. 비밀번호를 잘못 넣었는데 잠금이 풀리던 문제, ‘비밀번호 다시 묻지 않기’가 한 시간 뒤 풀리던 문제를 고쳤습니다. 이 옵션을 끄면 창을 닫을 때 로그아웃되고, 탈퇴할 때는 비밀번호를 한 번 더 묻습니다. 새로 만드는 아이디는 소문자로 저장됩니다."],["카드 불러오기","방송인·프리랜서는 항목을 그 유형에 맞춰 짐작합니다(쿠팡 → 장비 등). 간이·면세 가맹점에서 쓴 건 부가세 공제에서 뺍니다."]]},{날:"2026년 9월 23일",것들:[["미수금을 둘로 나눠 보여드립니다","헤더의 미수금 아래에 ‘입금 대기’와 ‘계약만 됨’이 따로 나옵니다. 입금 대기는 계산서를 이미 끊은 건이라 매출에도 들어가 있어서, 매출과 미수금을 그냥 더하면 두 번 세어집니다. 전체 계약 규모는 매출에 ‘계약만 됨’만 더해서 보시면 됩니다."]]},{날:"2026년 9월 18일",것들:[["‘본업·부업 3.3%’ 이름을 바꿨습니다","회사 다니면서 프리랜서 일을 하시는 분께 ‘본업’이 회사처럼 읽혀 헷갈렸습니다. 이제 ‘이미 낸 세금 · 3.3%’, ‘이미 낸 세금 · 연말정산’으로 나옵니다. 마이너스는 받을 때 이미 뗀 세금이라 5월에 빼준다는 뜻입니다."],["설정의 ‘3.3% 떼는 다른 일’ 칸을 없앱니다","3.3% 수입을 기록 탭과 설정 두 군데에 넣게 되어 있어 같은 걸 두 번 세는 일이 생겼습니다. 앞으로는 기록 탭 한 곳에서만 받습니다. 설정에 값이 남아 있는 분께는 옮기시라는 안내가 뜹니다."],["회사 급여를 기록 탭에 넣지 않도록","설정에서 4대보험 월급을 켜두셨으면, 기록 탭에서 수입을 넣을 때 ‘회사 급여는 여기 넣지 마세요’가 뜹니다."],["세무사 상담 권유","종합소득세가 500만원을 넘게 계산되면 세무사 상담을 권하는 안내가 뜹니다. 그 규모면 앱이 반영 못 하는 공제만으로도 차이가 크기 때문입니다."]]},{날:"2026년 9월 8일",것들:[["계약 탭에서 수정하면 전체 폼으로","계약 탭 안의 수정은 날짜·금액·메모만 고칠 수 있어서, 상태를 ‘계산서 없이 입금됨’으로 바꾸거나 실제 입금액을 넣을 수 없었습니다. 이제 수정을 누르면 기록 탭의 전체 폼으로 넘어가 모든 걸 고칠 수 있습니다. 계약 탭 목록에는 상태와 실입금액이 바로 보입니다."]]},{날:"2026년 9월 7일",것들:[["계산서 없이 입금된 건","수입 상태에 ‘계산서 없이 입금됨’이 생겼습니다. 플랫폼 정산이나 현금처럼 계산서는 안 끊었지만 돈이 들어온 경우입니다. 매출에는 잡히고 신고서의 ‘기타’ 칸으로 갑니다. 실제 입금액도 함께 적어둘 수 있습니다."],["연간 탭에서 항목 골라 보기","지출 항목을 골라 그것만 월별로 볼 수 있습니다. 주유비만, 인건비만, 또는 둘을 합쳐서. 합계와 월평균, 기록된 달 수가 함께 나옵니다."]]},{날:"2026년 9월 4일",것들:[["이용 현황 수집 항목 추가","어느 탭을 보는지, 카드 불러오기·백업·계정 만들기를 쓰는지 같은 기능 사용 여부를 통계로 보냅니다. 어떤 기능을 다듬어야 할지 판단하려는 것이고, 금액·거래처 등 기록 내용은 보내지 않습니다. 개인정보처리방침에도 적어두었습니다."],["백업 알림","계정 없이 쓰시는 분께 기록이 쌓였는데 백업이 없거나 한 달이 넘었으면 알려드립니다. 계정을 만드신 분은 서버에 올라가므로 뜨지 않습니다."],["인터넷이 끊기면 알려드립니다","연결이 끊긴 동안은 이 기기에만 저장되고, 다시 연결되면 서버로 올라간다는 걸 화면 위에 표시합니다."],["답 안 한 항목 표시","식비·차량·구독처럼 되묻는 항목인데 답이 비어 있으면 목록에 ‘답 필요’로 표시합니다. 카드 내역으로 넣은 건에 흔한데, 답을 채워야 경비 인정과 부가세 공제가 제대로 판정됩니다. 점검 항목에서도 건수를 알려드립니다."],["전체 삭제 시 서버도 함께 비움","로그인한 상태에서 전체 기록을 지우면 서버에 올려둔 것도 함께 비웁니다. 그동안은 다른 기기에서 지운 기록이 되살아날 수 있었습니다."],["오래 켜둔 뒤 탈퇴·삭제가 안 되던 문제","한 시간 넘게 켜둔 뒤 서버 기록 지우기나 탈퇴를 누르면 실패하던 문제를 고쳤습니다."]]},{날:"2026년 9월 2일",것들:[["수입 상태를 고칠 때 반영되지 않던 문제","‘계약만 됨’에서 ‘계산서 발행
