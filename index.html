8 \uACC4\uC0B0\uC744 \uBC14\uB85C\uC7A1\uC558\uC2B5\uB2C8\uB2E4","\u2460 \uD68C\uC0AC \uAE09\uC5EC\uAC00 \uC788\uC73C\uBA74 \uAE09\uC5EC\uBD84 \uC138\uAE08\uAE4C\uC9C0 \uB2E4\uC2DC \uC7A1\uD600 \uD06C\uAC8C \uB098\uC624\uB358 \uBB38\uC81C\uB97C \uACE0\uCCE4\uC2B5\uB2C8\uB2E4. \uC774\uC81C \uAE09\uC5EC\uC5D0 \uC774 \uC218\uC785\uC774 \uB354\uD574\uC838 \uB298\uC5B4\uB098\uB294 \uC138\uAE08\uB9CC \uBCF4\uC5EC\uB4DC\uB9AC\uACE0, \uC5F0\uB9D0\uC815\uC0B0 \uACB0\uC815\uC138\uC561\uC740 \uB123\uC9C0 \uC54A\uC73C\uC154\uB3C4 \uB429\uB2C8\uB2E4. \u2461 \uC77C\uBC18\uACFC\uC138\uC790\uAC00 \uB3CC\uB824\uBC1B\uB294 \uB9E4\uC785 \uBD80\uAC00\uC138\uAC00 \uC885\uD569\uC18C\uB4DD\uC138 \uACBD\uBE44\uC5D0\uB3C4 \uB610 \uB4E4\uC5B4\uAC00\uB358 \uBB38\uC81C, \u2462 \uACC4\uC0B0\uC11C(\uBA74\uC138) \uB9E4\uCD9C\uC5D0 \uBD80\uAC00\uC138\uAC00 \uBD99\uB358 \uBB38\uC81C, \u2463 \uAC00\uC6A9 \uC790\uAE08\uC5D0\uC11C \uBD80\uAC00\uC138\uB97C \uB450 \uBC88 \uBE7C\uB358 \uBB38\uC81C, \u2464 \uC0AC\uC5C5 \uC801\uC790\uB97C 0\uC73C\uB85C \uBCF4\uB358 \uBB38\uC81C(\uC774\uC81C \uAE09\uC5EC\uC5D0\uC11C \uBE8D\uB2C8\uB2E4)\uB97C \uACE0\uCCE4\uC2B5\uB2C8\uB2E4."],["3.3%\uB294 \uC2E4\uC81C\uB85C \uB5C0 \uC218\uC785\uB9CC \uBE7C\uB4DC\uB9BD\uB2C8\uB2E4","\uC0AC\uC5C5\uC790\uB4F1\uB85D\uC774 \uC5C6\uB294 \uBD84\uC740 \uC218\uC785\uC744 \uB123\uC744 \uB54C \u20183.3% \uB5BC\uACE0 \uBC1B\uC74C / \uC548 \uB5BC\uACE0 \uBC1B\uC74C\u2019\uC744 \uACE0\uB985\uB2C8\uB2E4. \uC560\uB4DC\uC13C\uC2A4\uCC98\uB7FC \uC548 \uB5BC\uACE0 \uBC1B\uC740 \uB3C8\uC5D0\uC11C\uB3C4 3.3%\uB97C \uBE7C\uC8FC\uB358 \uBB38\uC81C\uB97C \uACE0\uCCE4\uC2B5\uB2C8\uB2E4. \uC608\uC804 \uAE30\uB85D\uC740 \uC124\uC815\uC758 \u20183.3%\uB97C \uB5BC\uACE0 \uBC1B\uC2B5\uB2C8\uB2E4\u2019\uB97C \uB530\uB985\uB2C8\uB2E4."],["\uD574\uB9C8\uB2E4 \uB530\uB85C \uBD05\uB2C8\uB2E4","\uC0C1\uB2E8\uC5D0\uC11C \uC5F0\uB3C4\uB97C \uACE0\uB97C \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC791\uB144 \uAE30\uB85D\uACFC \uC62C\uD574 \uAE30\uB85D\uC774 \uC6D4\uB9CC \uAC19\uC73C\uBA74 \uD569\uCCD0\uC9C0\uB358 \uBB38\uC81C\uB97C \uACE0\uCCE4\uACE0, \uC138\uAE08 \uD0ED\uC758 \uB0A9\uBD80 \uAE30\uB85D\uB3C4 \uD574\uB9C8\uB2E4 \uB530\uB85C \uC801\uC2B5\uB2C8\uB2E4."],["\u2018\uC55E\uC73C\uB85C \uB0BC \uC138\uAE08\u2019\uC774 \uAE30\uD55C \uAE30\uC900\uC73C\uB85C \uBC14\uB00C\uC5C8\uC2B5\uB2C8\uB2E4","7\uC6D4 1~25\uC77C\uC5D0\uB294 \uC544\uC9C1 \uC548 \uB0B8 1\uAE30\uAC00, 1\uC6D4 1~25\uC77C\uC5D0\uB294 \uC791\uB144 2\uAE30\uAC00 \uBE60\uC838 \uC788\uC5C8\uC2B5\uB2C8\uB2E4. \uC774\uC81C \uBCF4\uACE0 \uC788\uB294 \uC5F0\uB3C4\uC640 \uC0C1\uAD00\uC5C6\uC774 \uC624\uB298 \uAE30\uC900\uC73C\uB85C \uC2E0\uACE0 \uAE30\uD55C\uC774 \uC548 \uC9C0\uB09C \uC138\uAE08(1~5\uC6D4\uC5D0\uB294 \uC791\uB144 \uC885\uD569\uC18C\uB4DD\uC138 \uD3EC\uD568)\uC744 \uBAA8\uB450 \uB123\uACE0, \uC138\uAE08 \uD0ED\uC5D0 \uB0C8\uB2E4\uACE0 \uC801\uC740 \uAC74 \uBE8D\uB2C8\uB2E4."],["\uAC04\uC774\uACFC\uC138\uC790 \uACC4\uC0B0","1\uB144 \uB2E8\uC704\uB85C \uACC4\uC0B0\uD558\uACE0, 1\uB144 \uB9E4\uCD9C(\uBD80\uAC00\uC138 \uD3EC\uD568)\uC774 4,800\uB9CC\uC6D0 \uBBF8\uB9CC\uC774\uBA74 0\uC6D0\uC73C\uB85C \uBD05\uB2C8\uB2E4. \uC2E0\uACE0 \uD0ED\uC5D0 \uAC04\uC774\uACFC\uC138\uC790 \uC591\uC2DD\uC774 \uB530\uB85C \uB098\uC635\uB2C8\uB2E4."],["\uB2F5\uC774 \uBE48 \uD56D\uBAA9\uC740 \uBD88\uB9AC\uD55C \uCABD\uC73C\uB85C","\uCE74\uB4DC \uB0B4\uC5ED\uC73C\uB85C \uB123\uACE0 \uB2F5\uC744 \uC548 \uCC44\uC6B4 \uC2DD\uBE44\xB7\uCC28\uB7C9\xB7\uAD6C\uB3C5\uC740 \uACBD\uBE44\xB7\uACF5\uC81C\uB97C \uBE7C\uACE0 \uACC4\uC0B0\uD569\uB2C8\uB2E4. \uC138\uAE08\uC744 \uBAA8\uC790\uB77C\uAC8C \uB5BC\uC5B4\uB450\uC9C0 \uC54A\uB3C4\uB85D \uD558\uB824\uB294 \uAC83\uC774\uACE0, \uB2F5\uC744 \uCC44\uC6B0\uBA74 \uBC14\uB85C \uB2E4\uC2DC \uACC4\uC0B0\uB429\uB2C8\uB2E4."],["\uACE0\uCE5C \uBC84\uADF8","\uB0A0\uC9DC \uC5C6\uC774 \uB0A8\uAE34 \uC794\uAE08\uC744 \uACE0\uCE58\uBA74 \uB9E4\uCD9C\uB85C \uBC14\uB00C\uB358 \uBB38\uC81C \xB7 \uACC4\uC57D \uC815\uBCF4\uC5D0\uC11C \uAC70\uB798\uCC98\uB9CC \uBC14\uAFD4\uB3C4 \uBA54\uBAA8\uAC00 \uC9C0\uC6CC\uC9C0\uB358 \uBB38\uC81C \xB7 \uC785\uAE08\uC77C\uB9CC \uB123\uC73C\uBA74 \u2018\uC785\uAE08 \uB300\uAE30\u2019\uB85C \uB0A8\uB358 \uBB38\uC81C \xB7 \uB450 \uBC88\uC9F8 \uB9E4\uCD9C\uBD80\uD130 \uC99D\uBE59\uC774 \u2018\uC0AC\uC5C5\uC6A9 \uCE74\uB4DC\u2019\uB85C \uBC14\uB00C\uB358 \uBB38\uC81C \xB7 \uC720\uD615\uC744 \uBC14\uAFB8\uBA74 \uC9C0\uCD9C\uC774 \uC0AC\uB77C\uC9C0\uAC70\uB098 \uC2DD\uBE44 \uB2F5\uC758 \uB73B\uC774 \uB4A4\uC9D1\uD788\uB358 \uBB38\uC81C \xB7 \uC720\uD615\uC744 \uBC14\uAFB8\uBA74 \uAC04\uC774\uACFC\uC138\uAC00 \uB418\uB3CC\uC544\uAC00\uB358 \uBB38\uC81C \xB7 \uC804\uCCB4 \uAE30\uB85D \uC0AD\uC81C\uAC00 \uC124\uC815\uAE4C\uC9C0 \uC9C0\uC6B0\uB358 \uBB38\uC81C \xB7 \uACBD\uBE44\uC728\uC5D0 \uC18C\uC218\uC810\uC744 \uBABB \uB123\uB358 \uBB38\uC81C \xB7 \uAC04\uD3B8\uC7A5\uBD80\uC5D0 \uACC4\uC57D\uB9CC \uB41C \uAC74\uACFC \uACBD\uBE44 \uC544\uB2CC \uC9C0\uCD9C\uC774 \uB4E4\uC5B4\uAC00\uB358 \uBB38\uC81C \xB7 \uC0AC\uC5C5\uC790\uB4F1\uB85D\uD55C \uBC29\uC1A1\uC778\xB7\uD504\uB9AC\uB79C\uC11C\uC758 \uC7A5\uBE44 \uBD80\uAC00\uC138\uAC00 0\uC6D0\uC774\uB358 \uBB38\uC81C."],["\uC5EC\uB7EC \uAE30\uAE30 \uC4F8 \uB54C \uB354 \uC548\uC804\uD558\uAC8C","\uB2E4\uB978 \uAE30\uAE30\uC5D0\uC11C \uBC14\uB010 \uAE30\uB85D\uC744 \uBAA8\uB974\uACE0 \uB36E\uC5B4\uC4F0\uC9C0 \uC54A\uB3C4\uB85D, \uC62C\uB9AC\uAE30 \uC804\uC5D0 \uC11C\uBC84\uB97C \uD655\uC778\uD569\uB2C8\uB2E4. \uD55C\uCABD\uC5D0\uC11C\uB9CC \uBC14\uB00C\uC5C8\uC73C\uBA74 \uC54C\uC544\uC11C \uB9DE\uCD94\uACE0, \uC591\uCABD \uB2E4 \uBC14\uB00C\uC5C8\uC744 \uB54C\uB9CC \uC5B4\uB290 \uCABD\uC744 \uC4F8\uC9C0 \uBB3B\uC2B5\uB2C8\uB2E4. \uC11C\uBC84\uC5D0\uC11C \uBC1B\uC544\uC624\uC9C0 \uBABB\uD588\uC744 \uB54C\uB294 \uC62C\uB9AC\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uBE44\uBC00\uBC88\uD638\uB97C \uC798\uBABB \uB123\uC5C8\uB294\uB370 \uC7A0\uAE08\uC774 \uD480\uB9AC\uB358 \uBB38\uC81C, \u2018\uBE44\uBC00\uBC88\uD638 \uB2E4\uC2DC \uBB3B\uC9C0 \uC54A\uAE30\u2019\uAC
