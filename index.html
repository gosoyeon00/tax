\uC73C\uBA74(\uC544\uC774\uD3F0\uC740 \uB354 \uC77C\uCC0D) \uC11C\uBC84\uC5D0 \uC62C\uB9AC\uC9C0 \uBABB\uD558\uACE0 \u2018\uC5F0\uACB0\uB418\uBA74 \uB2E4\uC2DC \uC62C\uB9BD\uB2C8\uB2E4\u2019\uB9CC \uBC18\uBCF5\uB418\uB358 \uBB38\uC81C\uB97C \uACE0\uCCE4\uC2B5\uB2C8\uB2E4. \uC124\uC815\xB7\uB0A9\uBD80\xB7\uACE0\uC815\uBE44\uB9CC \uBC14\uAFBC \uAC83\uB3C4 \uB2E4\uB978 \uAE30\uAE30\uC640 \uC81C\uB300\uB85C \uB9DE\uCDB0\uC9C0\uACE0, \uAC19\uC740 \uAE30\uAE30\uC5D0\uC11C \uD0ED \uB450 \uAC1C\uB97C \uC5F4\uC5B4\uB3C4 \uC11C\uB85C\uC758 \uAE30\uB85D\uC744 \uB36E\uC5B4\uC4F0\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4. \uB2E4\uB978 \uAE30\uAE30\uC5D0\uC11C \uAE30\uB85D\uC744 \uBAA8\uB450 \uC9C0\uC6E0\uC744 \uB54C\uB294 \uB530\uB77C \uC9C0\uC6B0\uC9C0 \uC54A\uACE0 \uC5B4\uB290 \uCABD\uC744 \uC4F8\uC9C0 \uBB3C\uC5B4\uBD05\uB2C8\uB2E4. \uC62C\uB9AC\uAE30\uC5D0 \uC2E4\uD328\uD558\uBA74 30\uCD08 \uB4A4 \uD55C \uBC88 \uB354 \uD574\uBD05\uB2C8\uB2E4."],["\uB85C\uADF8\uC544\uC6C3\uD560 \uB54C \uC774 \uAE30\uAE30 \uAE30\uB85D\uB3C4 \uC9C0\uC6B0\uAE30","\uACF5\uC6A9 \uCEF4\uD4E8\uD130\uB77C\uBA74 \uB85C\uADF8\uC544\uC6C3\uD560 \uB54C \u2018\uC774 \uAE30\uAE30\uC5D0 \uC788\uB294 \uAE30\uB85D\uB3C4 \uC9C0\uC6B0\uAE30\u2019\uB97C \uCF1C\uC138\uC694. \uC11C\uBC84\uC5D0 \uB2E4 \uC62C\uB77C\uAC04 \uAC78 \uD655\uC778\uD55C \uB4A4\uC5D0\uB9CC \uC9C0\uC6C1\uB2C8\uB2E4. \uC804\uCCB4 \uAE30\uB85D \uC0AD\uC81C \uC9C1\uC804\uC5D0\uB294 \uBC31\uC5C5 \uD30C\uC77C\uC744 \uC790\uB3D9\uC73C\uB85C \uB0B4\uB824\uBC1B\uC2B5\uB2C8\uB2E4."],["\uC608\uC815\uACE0\uC9C0\xB7\uC911\uAC04\uC608\uB0A9","\uC138\uAE08 \uD0ED\uC5D0 \uBD80\uAC00\uC138 \uC608\uC815\uACE0\uC9C0(4\uC6D4\xB710\uC6D4, \uAC04\uC774\uACFC\uC138\uC790\uB294 7\uC6D4 \uC608\uC815\uBD80\uACFC)\uC640 \uC885\uD569\uC18C\uB4DD\uC138 \uC911\uAC04\uC608\uB0A9(11\uC6D4)\uC73C\uB85C \uBBF8\uB9AC \uB0B8 \uAE08\uC561\uC744 \uC801\uB294 \uCE78\uC744 \uB123\uC5C8\uC2B5\uB2C8\uB2E4. \uC801\uC73C\uBA74 \u2018\uC55E\uC73C\uB85C \uB0BC \uC138\uAE08\u2019\uC5D0\uC11C \uADF8\uB9CC\uD07C\uB9CC \uBE60\uC9D1\uB2C8\uB2E4(\uC608\uC804\uC5D0\uB294 \uADF8 \uAE30\uAC04 \uC804\uCCB4\uAC00 \uBE60\uC84C\uC2B5\uB2C8\uB2E4). \uAE30\uD55C\uC774 \uD1A0\xB7\uC77C\uC694\uC77C\uC774\uBA74 \uB2E4\uC74C \uC6D4\uC694\uC77C\uAE4C\uC9C0\uB85C \uC149\uB2C8\uB2E4."],["\uC601\uC138\uC728 \uB9E4\uCD9C","\uC0AC\uC5C5\uC790\uB4F1\uB85D\uC744 \uD55C \uBC29\uC1A1\uC778\xB7\uC0AC\uC5C5\uC790\uAC00 \uC560\uB4DC\uC13C\uC2A4\uCC98\uB7FC \uD574\uC678\uC5D0\uC11C \uC678\uD654\uB85C \uBC1B\uB294 \uB3C8\uC744 \u2018\uC601\uC138\uC728\u2019\uB85C \uB123\uC744 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uBD80\uAC00\uC138 0%\uB85C \uACC4\uC0B0\uD558\uACE0 \uC2E0\uACE0 \uD0ED\uC5D0 \uC601\uC138\uC728 \uCE78\uC73C\uB85C \uBCF4\uC5EC\uB4DC\uB9BD\uB2C8\uB2E4."],["\uC548\uB0B4 \uBB38\uAD6C \uBC14\uB85C\uC7A1\uAE30","\uACBD\uBE44\uC728 \uB300\uC0C1\uC774\uC5B4\uB3C4 \uC7A5\uBD80\uB85C \uC2E0\uACE0\uD560 \uC218 \uC788\uB2E4\uB294 \uC810, \uC6D0\uCC9C\uC138\uB97C \uBE60\uB728\uB9AC\uBA74 \uACBD\uBE44\uAC00 \uC548 \uB418\uB294 \uAC8C \uC544\uB2C8\uB77C \uAC00\uC0B0\uC138\uAC00 \uBD99\uB294\uB2E4\uB294 \uC810, \uC811\uB300\uBE44 \uAE30\uBCF8\uD55C\uB3C4(\uC911\uC18C\uAE30\uC5C5 3,600\uB9CC\uC6D0), \uC18C\uADDC\uBAA8\uC0AC\uC5C5\uC790\uC758 \uAC00\uC0B0\uC138 \uBA74\uC81C, \uBD80\uAC00\uC138 \uAE30\uAC04\uC740 \uACF5\uAE09\uC2DC\uAE30\uB85C \uAC08\uB9B0\uB2E4\uB294 \uC810\uC744 \uBC14\uB85C\uC7A1\uC558\uC2B5\uB2C8\uB2E4. \uD574\uC678 \uC778\uBCF4\uC774\uC2A4\uB294 \uC99D\uBE59 \uAC00\uC0B0\uC138 \uB300\uC0C1\uC73C\uB85C \uC7A1\uC9C0 \uC54A\uACE0, \uAE30\uC900\uACBD\uBE44\uC728 \uCC38\uACE0 \uACC4\uC0B0\uC5D0 \uBC95\uC815 \uC0C1\uD55C(\uB2E8\uC21C\uACBD\uBE44\uC728 \uC18C\uB4DD\uC758 2.8\uBC30)\uC744 \uB123\uC5C8\uC2B5\uB2C8\uB2E4."],["\uC4F0\uAE30 \uD3B8\uD558\uAC8C\xB7\uBE60\uB974\uAC8C","\uD3F0\uC5D0\uC11C \uD0ED 9\uAC1C\uAC00 5\uCE78 \uACA9\uC790\uB85C \uB2E4 \uBCF4\uC774\uACE0, \uC2A4\uD06C\uB864\uD574\uB3C4 \uC704\uC5D0 \uBD99\uC5B4 \uC788\uC2B5\uB2C8\uB2E4. \uC218\uC785\uC744 \uB123\uC744 \uB54C \u2018\uD1B5\uC7A5\uC5D0 \uB4E4\uC5B4\uC628 \uAE08\uC561\u2019 \uCE78\uC740 \uAE08\uC561 \uC544\uB798\uC5D0 \uC811\uC5B4 \uB450\uC5C8\uACE0, \uAE30\uB85D\uC744 \uB123\uC73C\uBA74 \uC54C\uB9BC\uC774 \uB728\uBA70 \uBC14\uB85C \uB418\uB3CC\uB9B4 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uBA38\uB9AC\uC758 \uC22B\uC790 \uC124\uBA85\uC740 \uD3F0\uC5D0\uC11C \uD55C \uBC88 \uB20C\uB7EC \uC5F4\uB9BD\uB2C8\uB2E4. \uCE74\uB4DC \uB0B4\uC5ED \uBD88\uB7EC\uC624\uAE30, \uAE30\uB85D\uC774 \uB9CE\uC744 \uB54C\uC758 \uC785\uB825\xB7\uAC04\uD3B8\uC7A5\uBD80 \uD654\uBA74\uC774 \uD6E8\uC52C \uBE68\uB77C\uC84C\uC2B5\uB2C8\uB2E4."],["\uC218\uC218\uB8CC \uD56D\uBAA9 \uCD94\uAC00","\uC9C0\uCD9C\uC5D0 \u2018\uC218\uC218\uB8CC (\uD50C\uB7AB\uD3FC\xB7\uCE74\uB4DC)\u2019\uB97C \uB123\uC5C8\uC2B5\uB2C8\uB2E4(\uD504\uB9AC\uB79C\uC11C\uB294 \u2018\uC218\uC218\uB8CC (\uD50C\uB7AB\uD3FC)\u2019). \uD06C\uBABD \uAC19\uC740 \uD50C\uB7AB\uD3FC\uC774 \uBCF4\uB0B4\uC8FC\uB294 \uD310\uB9E4 \uC218\uC218\uB8CC \uACC4\uC0B0\uC11C\uB098 \uCE74\uB4DC\xB7\uACB0\uC81C \uC218\uC218\uB8CC\uB97C \uB530\uB85C \uB123\uC744 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uB9E4\uCD9C\uC744 \uC218\uC218\uB8CC \uB5BC\uAE30 \uC804 \uAE08\uC561\uC73C\uB85C \uB123\uC740 \uAC74\uC758 \uC218\uC218\uB8CC\uB9CC \uB123\uC73C\uC138\uC694. \uC815\uC0B0\uC561\uC73C\uB85C \uB123\uC740 \uAC74\uC758 \uC218\uC218\uB8CC\uAE4C\uC9C0 \uB123\uC73C\uBA74 \uB450 \uBC88 \uBE60\uC9D1\uB2C8\uB2E4."],["\uD50C\uB7AB\uD3FC \uB9E4\uCD9C\uC774 \uC815\uC0B0\uC561\uC778\uC9C0 \uD45C\uC2DC","\uD06C\uBABD\xB7\uC228\uACE0 \uAC19\uC740 \uD50C\uB7AB\uD3FC \uB9E4\uCD9C \uC911 \uAE08\uC561\uC774 \uB531 \uB5A8\uC5B4\uC9C0\uC9C0 \uC54A\uC544 \uC218\uC218\uB8CC\uB97C \uB5C0 \uC815\uC0B0\uC561\uC73C\uB85C \uBCF4\uC774\uB294 \uAC74\uC744 \uAE30\uB85D \uD0ED \uB9E8 \uC704\uC5D0 \uBAA8\uC544 \uBCF4\uC5EC\uB4DC\uB9BD\uB2C8\uB2E4. \u2018\uC815\uC0B0\uC561\uC774 \uB9DE\uC544\uC694\u2019\uB098 \u2018\uC804\uCCB4 \uAE08\uC561\uC774\uC5D0\uC694\u2019\uB97C \uD55C \uBC88 \uB204\uB974\uBA74 \uBAA9\uB85D\uC5D0\uB3C4 \uD45C\uC2DC\uAC00 \uB0A8\uC2B5\uB2C8\uB2E4. \uC815\uC0B0\uC561\uC73C\uB85C \uB123\uC740 \uD50C\uB7AB\uD3FC \uB9E4\uCD9C\uACFC \uC218\uC218\uB8CC \uC9C0\uCD9C\uC774 \uAC19\uC740 \uD574\uC5D0 \uD568\uAED8 \uC788\uC73C\uBA74 \uC9C4\uB2E8\uC5D0\uC11C\uB3C4 \uC54C\uB824\uB4DC\uB9BD\uB2C8\uB2E4. \uC778\uD130\uB137\uBC29\uC1A1\uC778 \uC720\uD615\uC740 \uC6D0\uB798 \uC815\uC0B0\uC561\uC73C\uB85C \uB123\uB294 \uBC29\uC2DD\uC774\uB77C \uD574\uB2F9 \uC5C6\uC2B5\uB2C8\uB2E4."],["\uCE74\uB4DC \uBD88\uB7EC\uC624\uAE30: \uD06C\uBABD\xB7\uC228\uACE0\uB294 \uAD11\uACE0\uBE44\uB85C","\uCE74\uB4DC \uB0B4\uC5ED\uC758 \uD06C\uBABD\xB7\uC228\uACE0 \uACB0\uC81C\uB294 \uB300\uAC1C \uD310\uB9E4\uC790\uAC00 \uB0B4\uB294 \uAD11\uACE0\xB7\uACAC\uC801 \uBE44\uC6A9\uC774\uB77C \u2018\uAD11\uACE0\uC120\uC804\uBE44\u2019\uB85C \uC9D0\uC791\uD569\uB2C8\uB2E4(\uC608\uC804\uC5D0\uB294 \uC678\uC8FC\uBE44). \uC678\uC8FC\uB97C \uB9E1\uAE34 \uACB0\uC81C\uB77C\uBA74 \uD56D\uBAA9\uC744 \uBC14\uAFD4\uC8FC\uC138\uC694. \uAD11\uACE0 \uD56D\uBAA9\uC774 \uC5C6\uB294 \uC720\uD615\uC5D0\uC11C \uD06C\uBABD \uACB0\uC81C\uB294 \uC608\uC804\uCC98\uB7FC \uC678\uC8FC\uB85C \uB461\uB2C8\uB2E4."],["\uB9C1\uD06C \uBBF8\uB9AC\uBCF4\uAE30\uC640 \uC571 \uC544\uC774\uCF58","\uCE74\uD1A1\xB7X \uB4F1\uC5D0 \uC8FC\uC18C\uB97C \uBD99\uC774\uBA74 \uC571 \uC774\uB984\uACFC \uADF8\uB9BC\uC774 \uB2F4\uAE34 \uBBF8\uB9AC\uBCF4\uAE30\uAC00 \uB728\uACE0, \uD734\uB300\uD3F0 \uD648 \uD654\uBA74\uC5D0 \uCD94\uAC00\uD558\uBA74 \uC571 \uC544\uC774\uCF58\uC774 \uBCF4\uC785\uB2C8\uB2E4. 9\uC6D4 27\uC77C\uBD80\uD130 \uC801\uC6A9\uB410\uC2B5\uB2C8\uB2E4."]]},{\uB0A0:"2026\uB144 9\uC6D4 26\uC77C",\uAC83\uB4E4:[["\uCC98\uC74C \uC624\uC2E0 \uBD84\uAED8 \uC2DC\uC791 \uD654\uBA74","\uCC98\uC74C \uC5F4\uBA74 \uC5B4\uB5A4 \uC571\uC778\uC9C0 \uD55C \uC904\uB85C \uC54C\uB824\uB4DC\uB9AC\uACE0, \uC5B4\uB5BB\uAC8C \uC77C\uD558\uB294\uC9C0 \u2192 \uC5C5\uC885 \u2192 \uCCAB \uC218\uC785 \uC21C\uC11C\uB85C 30\uCD08 \uC548\uC5D0 \uC2DC\uC791\uD560 \uC218 \uC788\uAC8C \uD588\uC2B5\uB2C8\uB2E4. \uAC74\uB108\uB6F0\uC5B4\uB3C4 \uB418\uACE0, \uACC4\uC815\uC774 \uC788\uC73C\uBA74 \uBC14\uB85C \uB85C\uADF8\uC778\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC774\uBBF8 \uC4F0\uC2DC\uB358 \uBD84\uAED8\uB294 \uB728\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4."],["\uC5C5\uC885\uC740 \uACE0\uB974\uAE30 \uC804\uAE4C\uC9C0 \u2018\uBBF8\uC815\u2019","\uC0C8\uB85C \uC624\uC2E0 \uBD84\uC758 \uC5C5\uC885\uC774 \uB2E4\uB978 \uC5C5\uC885\uC73C\uB85C \uBBF8\uB9AC \uB4E4\uC5B4\uAC00 \uC788\uB358 \uAC83\uC744 \u2018\uBBF8\uC815\u2019\uC73C\uB85C \uBC14\uAFE8\uC2B5\uB2C8\uB2E4. \uC5C5\uC885\uC744 \uACE0\uB974\uAE30 \uC804\uC5D0\uB294 \uACBD\uBE44 \uC810\uAC80\uC5D0\uC11C \uBE44\uAD50\uD558\uC9C0 \uC54A\uACE0, \uACE0\uB974\uBA74 \uAC19\uC740 \uC5C5\uC885 \uD3C9\uADE0\uACFC \uBE44\uAD50\uD574 \uB4DC\uB9BD\uB2C8\uB2E4."],["\uBC31\uC5C5 \uBD88\uB7EC\uC624\uAE30 \uC804\uC5D0 \uD55C \uBC88 \uB354 \uD655\uC778","\uBC31\uC5C5 \uD30C\uC77C\uC744 \uACE0\uB974\uBA74 \uBC14\uB85C \uBC14\uAFB8\uC9C0 \uC54A\uACE0 \u2018\uC9C0\uAE08 \uAE30\uB85D \uBA87 \uAC74 \u2192 \uD30C\uC77C \uAE30\uB85D \uBA87 \uAC74\u2019\uC744 \uBA3C\uC800 \uBCF4\uC5EC\uB4DC\uB9BD\uB2C8\uB2E4. \uBC14\uAFB8\uAE30 \uC804\uC5D0 \uC9C0\uAE08 \uAE30\uB85D\uC744 \uD30C\uC77C\uB85C \uC790\uB3D9\uC73C\uB85C \uBC1B\uC544\uB450\uACE0, \uBA87 \uAC74\uC744 \uBD88\uB7EC\uC654\uB294\uC9C0 \uD654\uBA74 \uC544\uB798\uC5D0 \uC54C\uB824\uB4DC\uB9BD\uB2C8\uB2E4."],["\uCE74\uB4DC \uB0B4\uC5ED\uC744 \uB354 \uC798 \uC77D\uC2B5\uB2C8\uB2E4","\uC708\uB3C4 \uC5D1\uC140\uC5D0\uC11C \uC800\uC7A5\uD55C CSV(\uD55C\uAE00\uC774 \uAE68\uC9C0\uB358 \uD30C\uC77C)\uB3C4 \uC77D\uC2B5\uB2C8\uB2E4. \uAC00\uB9F9\uC810 \uC790\uB9AC\uC5D0 \uC0AC\uC5C5\uC790\uBC88\uD638\uAC00 \uB4E4\uC5B4\uAC00\uAC70\uB098 \uBD80\uAC00\uC138 \uBE60\uC9C4 \uAE08\uC561\uC744 \uC77D\uB358 \uBB38\uC81C\uB97C \uACE0\uCCE4\uACE0, \uC5B4\uB290 \uC5F4\uC744 \uC77D\uC5C8\uB294\uC9C0 \uBCF4\uC5EC\uB4DC\uB9AC\uBA70 \uC9C1\uC811 \uBC14\uAFC0 \uC2 4","\uC7A5\uBE44 \uC9C8\uBB38\uC5D0 \u2018PC\xB7\uB178\uD2B8\uBD81\xB7\uD734\uB300\uD3F0\uC785\uB2C8\uB2E4\u2019 \uB2F5\uC774 \uC0DD\uACBC\uC2B5\uB2C8\uB2E4. \uC774 \uC14B(\uBAA8\uB2C8\uD130 \uAC19\uC740 \uC8FC\uBCC0\uAE30\uAE30 \uD3EC\uD568)\uC740 \uC138\uBC95\uC0C1 \uAE08\uC561\uACFC \uC0C1\uAD00\uC5C6\uC774 \uC0B0 \uD574\uC5D0 \uBC14\uB85C \uACBD\uBE44\uB85C \uB123\uC744 \uC218 \uC788\uC5B4 5\uB144\uC5D0 \uB098\uB204\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4."]]},{\uB0A0:"2026\uB144 9\uC6D4 23\uC77C \xB7 \uAC10\uAC00\uC0C1\uAC01",\uAC83\uB4E4:[["\uC7A5\uBE44\uB294 5\uB144\uC5D0 \uB098\uB220 \uACBD\uBE44\uB85C \uC7A1\uC2B5\uB2C8\uB2E4","\uD55C \uAC74\uC5D0 100\uB9CC\uC6D0\uC774 \uB118\uB294 \uC7A5\uBE44(\uCE74\uBA54\uB77C\xB7PC \uB4F1)\uB294 \uC0B0 \uD574\uC5D0 \uD55C\uAEBC\uBC88\uC5D0 \uACBD\uBE44\uB85C \uB123\uC9C0 \uC54A\uACE0, 5\uB144\uC5D0 \uAC78\uCCD0 \uB098\uB220 \uADF8\uD574 \uBAAB\uB9CC \uB123\uC2B5\uB2C8\uB2E4. \uBC29\uC2DD\uC740 \uC138\uBB34\uC0AC\uAC00 \uBCF4\uD1B5 \uC4F0\uB294 \uC815\uB960\uBC95(\uCC98\uC74C\uC5D0 \uB9CE\uC774, \uAC08\uC218\uB85D \uC801\uAC8C)\uC774\uACE0 \uC0B0 \uD574\uC5D0\uB294 \uC0B0 \uB2EC\uBD80\uD130 \uC149\uB2C8\uB2E4. \uADF8\uB3D9\uC548\uC740 \uC0B0 \uD574\uC5D0 \uC804\uBD80 \uACBD\uBE44\uB85C \uC7A1\uD600 \uADF8\uD574 \uC885\uD569\uC18C\uB4DD\uC138\uAC00 \uC2E4\uC81C\uBCF4\uB2E4 \uC801\uAC8C \uB098\uC654\uC2B5\uB2C8\uB2E4. \uB123\uC744 \uB54C \uD574\uB9C8\uB2E4 \uC5BC\uB9C8\uC529 \uB4E4\uC5B4\uAC00\uB294\uC9C0 \uBC14\uB85C \uBCF4\uC5EC\uB4DC\uB9AC\uACE0, \uD574\uAC00 \uBC14\uB00C\uC5B4\uB3C4 \uC571\uC774 \uC54C\uC544\uC11C \uADF8\uD574 \uBAAB\uC744 \uB123\uC2B5\uB2C8\uB2E4. \uBD80\uAC00\uC138\uB294 \uC9C0\uAE08\uCC98\uB7FC \uC0B0 \uAE30\uC5D0 \uC804\uC561 \uB3CC\uB824\uBC1B\uC2B5\uB2C8\uB2E4. \uC790\uC138\uD55C \uC124\uBA85\uC740 \uB3C4\uC6C0\uB9D0 \u203A \uC7A5\uBE44 \uAC10\uAC00\uC0C1\uAC01\uC5D0 \uC788\uC2B5\uB2C8\uB2E4."],["\uC2E0\uACE0 \uD0ED\xB7\uAC04\uD3B8\uC7A5\uBD80","\uC2E0\uACE0 \uD0ED\uC5D0 \uC7A5\uBE44\uBCC4 \uC62C\uD574 \uBAAB\uACFC \uB0A8\uC740 \uAE08\uC561\uC774 \uB098\uC624\uACE0, \uAC04\uD3B8\uC7A5\uBD80\uC5D0\uB294 12\uC6D4 31\uC77C\uC5D0 \uAC10\uAC00\uC0C1\uAC01\uBE44\uAC00 \uD55C \uC904 \uB4E4\uC5B4\uAC11\uB2C8\uB2E4. \uC678\uC8FC\uBE44\xB7\uC784\uCC28\uB8CC\uCC98\uB7FC \uC7A5\uBE44\uAC00 \uC544\uB2CC 100\uB9CC\uC6D0 \uB118\uB294 \uC9C0\uCD9C\uC740 \uC608\uC804\uCC98\uB7FC \uBC14\uB85C \uACBD\uBE44\uC785\uB2C8\uB2E4."],["\uC815\uC561\uBC95\uACFC \uC815\uB960\uBC95 \uC548\uB0B4","\uB3C4\uC6C0\uB9D0 \u203A \uC7A5\uBE44 \uAC10\uAC00\uC0C1\uAC01\uC5D0 \uB450 \uBC29\uC2DD\uC758 \uCC28\uC774\uB97C \uC815\uB9AC\uD588\uC2B5\uB2C8\uB2E4. \uC571\uC740 \uC7A5\uBE44\uC758 \uAE30\uBCF8 \uBC29\uC2DD\uC778 \uC815\uB960\uBC95\uC73C\uB85C \uACC4\uC0B0\uD569\uB2C8\uB2E4."]]},{\uB0A0:"2026\uB144 9\uC6D4 23\uC77C (\uC804\uCCB4 \uC810\uAC80)",\uAC83\uB4E4:[["\uC138\uAE08 \uACC4\uC0B0\uC744 \uBC14\uB85C\uC7A1\uC558\uC2B5\uB2C8\uB2E4","\u2460 \uD68C\uC0AC \uAE09\uC5EC\uAC00 \uC788\uC73C\uBA74 \uAE09\uC5EC\uBD84 \uC138\uAE08\uAE4C\uC9C0 \uB2E4\uC2DC \uC7A1\uD600 \uD06C\uAC8C \uB098\uC624\uB358 \uBB38\uC81C\uB97C \uACE0\uCCE4\uC2B5\uB2C8\uB2E4. \uC774\uC81C \uAE09\uC5EC\uC5D0 \uC774 \uC218\uC785\uC774 \uB354\uD574\uC838 \uB298\uC5B4\uB098\uB294 \uC138\uAE08\uB9CC \uBCF4\uC5EC\uB4DC\uB9AC\uACE0, \uC5F0\uB9D0\uC815\uC0B0 \uACB0\uC815\uC138\uC561\uC740 \uB123\uC9C0 \uC54A\uC73C\uC154\uB3C4 \uB429\uB2C8\uB2E4. \u2461 \uC77C\uBC18\uACFC\uC138\uC790\uAC00 \uB3CC\uB824\uBC1B\uB294 \uB9E4\uC785 \uBD80\uAC00\uC138\uAC00 \uC885\uD569\uC18C\uB4DD\uC138 \uACBD\uBE44\uC5D0\uB3C4 \uB610 \uB4E4\uC5B4\uAC00\uB358 \uBB38\uC81C, \u2462 \uACC4\uC0B0\uC11C(\uBA74\uC138) \uB9E4\uCD9C\uC5D0 \uBD80\uAC00\uC138\uAC00 \uBD99\uB358 \uBB38\uC81C, \u2463 \uAC00\uC6A9 \uC790\uAE08\uC5D0\uC11C \uBD80\uAC00\uC138\uB97C \uB450 \uBC88 \uBE7C\uB358 \uBB38\uC81C, \u2464 \uC0AC\uC5C5 \uC801\uC790\uB97C 0\uC73C\uB85C \uBCF4\uB358 \uBB38\uC81C(\uC774\uC81C \uAE09\uC5EC\uC5D0\uC11C \uBE8D\uB2C8\uB2E4)\uB97C \uACE0\uCCE4\uC2B5\uB2C8\uB2E4."],["3.3%\uB294 \uC2E4\uC81C\uB85C \uB5C0 \uC218\uC785\uB9CC \uBE7C\uB4DC\uB9BD\uB2C8\uB2E4","\uC0AC\uC5C5\uC790\uB4F1\uB85D\uC774 \uC5C6\uB294 \uBD84\uC740 \uC218\uC785\uC744 \uB123\uC744 \uB54C \u20183.3% \uB5BC\uACE0 \uBC1B\uC74C / \uC548 \uB5BC\uACE0 \uBC1B\uC74C\u2019\uC744 \uACE0\uB985\uB2C8\uB2E4. \uC560\uB4DC\uC13C\uC2A4\uCC98\uB7FC \uC548 \uB5BC\uACE0 \uBC1B\uC740 \uB3C8\uC5D0\uC11C\uB3C4 3.3%\uB97C \uBE7C\uC8FC\uB358 \uBB38\uC81C\uB97C \uACE0\uCCE4\uC2B5\uB2C8\uB2E4. \uC608\uC804 \uAE30\uB85D\uC740 \uC124\uC815\uC758 \u20183.3%\uB97C \uB5BC\uACE0 \uBC1B\uC2B5\uB2C8\uB2E4\u2019\uB97C \uB530\uB985\uB2C8\uB2E4."],["\uD574\uB9C8\uB2E4 \uB530\uB85C \uBD05\uB2C8\uB2E4","\uC0C1\uB2E8\uC5D0\uC11C \uC5F0\uB3C4\uB97C \uACE0\uB97C \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC791\uB144 \uAE30\uB85D\uACFC \uC62C\uD574 \uAE30\uB85D\uC774 \uC6D4\uB9CC \uAC19\uC73C\uBA74 \uD569\uCCD0\uC9C0\uB358 \uBB38\uC81C\uB97C \uACE0\uCCE4\uACE0, \uC138\uAE08 \uD0ED\uC758 \uB0A9\uBD80 \uAE30\uB85D\uB3C4 \uD574\uB9C8\uB2E4 \uB530\uB85C \uC801\uC2B5\uB2C8\uB2E4."],["\u2018\uC55E\uC73C\uB85C \uB0BC \uC138\uAE08\u2019\uC774 \uAE30\uD55C \uAE30\uC900\uC73C\uB85C \uBC14\uB00C\uC5C8\uC2B5\uB2C8\uB2E4","7\uC6D4 1~25\uC77C\uC5D0\uB294 \uC544\uC9C1 \uC548 \uB0B8 1\uAE30\uAC00, 1\uC6D4 1~25\uC77C\uC5D0\uB294 \uC791\uB144 2\uAE30\uAC00 \uBE60\uC838 \uC788\uC5C8\uC2B5\uB2C8\uB2E4. \uC774\uC81C \uBCF4\uACE0 \uC788\uB294 \uC5F0\uB3C4\uC640 \uC0C1\uAD00\uC5C6\uC774 \uC624\uB298 \uAE30\uC900\uC73C\uB85C \uC2E0\uACE0 \uAE30\uD55C\uC774 \uC548 \uC9C0\uB09C \uC138\uAE08(1~5\uC6D4\uC5D0\uB294 \uC791\uB144 \uC885\uD569\uC18C\uB4DD\uC138 \uD3EC\uD568)\uC744 \uBAA8\uB450 \uB123\uACE0, \uC138\uAE08 \uD0ED\uC5D0 \uB0C8\uB2E4\uACE0 \uC801\uC740 \uAC74 \uBE8D\uB2C8\uB2E4."],["\uAC04\uC774\uACFC\uC138\uC790 \uACC4\uC0B0","1\uB144 \uB2E8\uC704\uB85C \uACC4\uC0B0\uD558\uACE0, 1\uB144 \uB9E4\uCD9C(\uBD80\uAC00\uC138 \uD3EC\uD568)\uC774 4,800\uB9CC\uC6D0 \uBBF8\uB9CC\uC774\uBA74 0\uC6D0\uC73C\uB85C \uBD05\uB2C8\uB2E4. \uC2E0\uACE0 \uD0ED\uC5D0 \uAC04\uC774\uACFC\uC138\uC790 \uC591\uC2DD\uC774 \uB530\uB85C \uB098\uC635\uB2C8\uB2E4."],["\uB2F5\uC774 \uBE48 \uD56D\uBAA9\uC740 \uBD88\uB9AC\uD55C \uCABD\uC73C\uB85C","\uCE74\uB4DC \uB0B4\uC5ED\uC73C\uB85C \uB123\uACE0 \uB2F5\uC744 \uC548 \uCC44\uC6B4 \uC2DD\uBE44\xB7\uCC28\uB7C9\xB7\uAD6C\uB3C5\uC740 \uACBD\uBE44\xB7\uACF5\uC81C\uB97C \uBE7C\uACE0 \uACC4\uC0B0\uD569\uB2C8\uB2E4. \uC138\uAE08\uC744 \uBAA8\uC790\uB77C\uAC8C \uB5BC\uC5B4\uB450\uC9C0 \uC54A\uB3C4\uB85D \uD558\uB824\uB294 \uAC83\uC774\uACE0, \uB2F5\uC744 \uCC44\uC6B0\uBA74 \uBC14\uB85C \uB2E4\uC2DC \uACC4\uC0B0\uB429\uB2C8\uB2E4."],["\uACE0\uCE5C \uBC84\uADF8","\uB0A0\uC9DC \uC5C6\uC774 \uB0A8\uAE34 \uC794\uAE08\uC744 \uACE0\uCE58\uBA74 \uB9E4\uCD9C\uB85C \uBC14\uB00C\uB358 \uBB38\uC81C \xB7 \uACC4\uC57D \uC815\uBCF4\uC5D0\uC11C \uAC70\uB798\uCC98\uB9CC \uBC14\uAFD4\uB3C4 \uBA54\uBAA8\uAC00 \uC9C0\uC6CC\uC9C0\uB358 \uBB38\uC81C \xB7 \uC785\uAE08\uC77C\uB9CC \uB123\uC73C\uBA74 \u2018\uC785\uAE08 \uB300\uAE30\u2019\uB85C \uB0A8\uB358 \uBB38\uC81C \xB7 \uB450 \uBC88\uC9F8 \uB9E4\uCD9C\uBD80\uD130 \uC99D\uBE59\uC774 \u2018\uC0AC\uC5C5\uC6A9 \uCE74\uB4DC\u2019\uB85C \uBC14\uB00C\uB358 \uBB38\uC81C \xB7 \uC720\uD615\uC744 \uBC14\uAFB8\uBA74 \uC9C0\uCD9C\uC774 \uC0AC\uB77C\uC9C0\uAC70\uB098 \uC2DD\uBE44 \uB2F5\uC758 \uB73B\uC774 \uB4A4\uC9D1\uD788\uB358 \uBB38\uC81C \xB7 \uC720\uD615\uC744 \uBC14\uAFB8\uBA74 \uAC04\uC774\uACFC\uC138\uAC00 \uB418\uB3CC\uC544\uAC00\uB358 \uBB38\uC81C \xB7 \uC804\uCCB4 \uAE30\uB85D \uC0AD\uC81C\uAC00 \uC124\uC815\uAE4C\uC9C0 \uC9C0\uC6B0\uB358 \uBB38\uC81C \xB7 \uACBD\uBE44\uC728\uC5D0 \uC18C\uC218\uC810\uC744 \uBABB \uB123\uB358 \uBB38\uC81C \xB7 \uAC04\uD3B8\uC7A5\uBD80\uC5D0 \uACC4\uC57D\uB9CC \uB41C \uAC74\uACFC \uACBD\uBE44 \uC544\uB2CC \uC9C0\uCD9C\uC774 \uB4E4\uC5B4\uAC00\uB358 \uBB38\uC81C \xB7 \uC0AC\uC5C5\uC790\uB4F1\uB85D\uD55C \uBC29\uC1A1\uC778\xB7\uD504\uB9AC\uB79C\uC11C\uC758 \uC7A5\uBE44 \uBD80\uAC00\uC138\uAC00 0\uC6D0\uC774\uB358 \uBB38\uC8
